{% extends "base.html" %}

{% block title %}{{ code }} — {{ title }} | ImageMagic Pro{% endblock %}
{% block description %}{{ message }}{% endblock %}
{% block robots %}{% endblock %}

{% block content %}
<section class="text-center py-5">
    <p class="display-1 fw-bold text-muted">{{ code }}</p>
    <h2 class="h3">{{ title }}</h2>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Back to the editor</a>
</section>
{% endblock %}
